services:
  database:
    image: postgres:15
    container_name: database
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: content_manager
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: backend
    restart: always
    depends_on:
      - database
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/content_manager
      SECRET_KEY: supersecretkey
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: frontend
    restart: always
    depends_on:
      - backend
    environment:
      BACKEND_API_URL: http://backend:8000
    ports:
      - "8443:443"

  telegram:
    build: ./telegram
    container_name: telegram
    restart: always
    depends_on:
      - frontend
    environment:
      WEBAPP_URL: ${WEBAPP_URL:-https://example.com}
      BOT_TOKEN: ${BOT_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ADMINS: ${ADMINS}
      SERVICE_ACCOUNT_TOKEN: ${SERVICE_ACCOUNT_TOKEN}

volumes:
  postgres_data: