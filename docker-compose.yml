services:
  database:
    image: postgres:15
    container_name: database
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: backend
    restart: always
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:?DB_USER is required}:${DB_PASSWORD:?DB_PASSWORD is required}@database:5432/${DB_NAME:?DB_NAME is required}
      APP_ENV: ${APP_ENV:-production}
      BACKEND_SECRET_KEY: ${BACKEND_SECRET_KEY:?BACKEND_SECRET_KEY is required}
      SERVICE_ACCOUNT_TOKEN: ${SERVICE_ACCOUNT_TOKEN:?SERVICE_ACCOUNT_TOKEN is required}
      PUBLICATION_WORKER_TOKEN: ${PUBLICATION_WORKER_TOKEN:?PUBLICATION_WORKER_TOKEN is required}
      AI_GENERATION_PROVIDER: ${AI_GENERATION_PROVIDER:-openai}
      AI_TRANSFORMATION_PROVIDER: ${AI_TRANSFORMATION_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GENERATION_LEASE_TIMEOUT_SECONDS: ${GENERATION_LEASE_TIMEOUT_SECONDS:-900}
      PYTHON_VALIDATOR_DIR: /var/lib/python-validator
      PYTHON_VALIDATOR_TIMEOUT_SECONDS: ${PYTHON_VALIDATOR_TIMEOUT_SECONDS:-8}
    volumes:
      - python_validator_jobs:/var/lib/python-validator
    ports:
      - "127.0.0.1:8000:8000"

  python-validator:
    build: ./validator
    container_name: python-validator
    restart: always
    read_only: true
    network_mode: none
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m
    volumes:
      - python_validator_jobs:/var/lib/python-validator

  frontend:
    build: ./frontend
    container_name: frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
      database:
        condition: service_healthy
    environment:
      BACKEND_API_URL: http://backend:8000
      FRONTEND_HOST: ${FRONTEND_HOST:-127.0.0.1}
      FRONTEND_SECRET_KEY: ${FRONTEND_SECRET_KEY:?FRONTEND_SECRET_KEY is required}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-}
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
    ports:
      - "127.0.0.1:3000:8000"

  telegram:
    build: ./telegram
    container_name: telegram
    restart: always
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    environment:
      WEBAPP_URL: ${WEBAPP_URL:?WEBAPP_URL is required}
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN is required}
      ADMINS: ${ADMINS:?ADMINS is required}
      TELEGRAM_CALLBACK_SECRET: ${TELEGRAM_CALLBACK_SECRET:?TELEGRAM_CALLBACK_SECRET is required}
      SERVICE_ACCOUNT_TOKEN: ${SERVICE_ACCOUNT_TOKEN:?SERVICE_ACCOUNT_TOKEN is required}
      PUBLICATION_WORKER_TOKEN: ${PUBLICATION_WORKER_TOKEN:?PUBLICATION_WORKER_TOKEN is required}
      BACKEND_API_URL: http://backend:8000
      SCHEDULE_CHECK_INTERVAL_SECONDS: ${SCHEDULE_CHECK_INTERVAL_SECONDS:-10}

volumes:
  postgres_data:
  python_validator_jobs:
