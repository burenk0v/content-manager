services:
  database:
    image: postgres:15
    container_name: database
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-content_manager}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: backend
    restart: always
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@database:5432/${DB_NAME:-content_manager}
      BACKEND_SECRET_KEY: ${BACKEND_SECRET_KEY}
      SERVICE_ACCOUNT_TOKEN: ${SERVICE_ACCOUNT_TOKEN}
      AI_GENERATION_PROVIDER: ${AI_GENERATION_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: frontend
    restart: always
    depends_on:
      - backend
    environment:
      BACKEND_API_URL: http://backend:8000
      FRONTEND_HOST: ${FRONTEND_HOST:-127.0.0.1}
      FRONTEND_SECRET_KEY: ${FRONTEND_SECRET_KEY}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "3000:8443"

  telegram:
    build: ./telegram
    container_name: telegram
    restart: always
    depends_on:
      - frontend
      - backend
    environment:
      WEBAPP_URL: ${WEBAPP_URL}
      BOT_TOKEN: ${BOT_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ADMINS: ${ADMINS}
      SERVICE_ACCOUNT_TOKEN: ${SERVICE_ACCOUNT_TOKEN}
      BACKEND_API_URL: http://backend:8000
      SCHEDULE_CHECK_INTERVAL_SECONDS: ${SCHEDULE_CHECK_INTERVAL_SECONDS:-10}

volumes:
  postgres_data:
